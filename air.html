<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어코리아 대기오염정보</title>
<style>
  body{font-family:system-ui,"Malgun Gothic",sans-serif;margin:0;background:#f4f7fa;color:#1b2430}
  header{background:#1f6feb;color:#fff;padding:20px 16px}
  header h1{margin:0 0 4px;font-size:20px} header p{margin:0;opacity:.85;font-size:13px}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  select,button{padding:8px 12px;font-size:15px;border:1px solid #c5ced8;border-radius:8px;background:#fff}
  button{background:#1f6feb;color:#fff;border-color:#1f6feb;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h3{margin:0 0 2px;font-size:17px} .time{font-size:12px;color:#6b7785;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0;font-size:14px}
  .g{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:#8a94a0}
  .g-좋음{background:#2da44e}.g-보통{background:#d29922}.g-나쁨{background:#e5702a}.g-매우나쁨{background:#cf222e}
  .msg{padding:16px;color:#6b7785}.err{color:#cf222e}
</style>
</head>
<body>
<header><h1>🌫️ 에어코리아 대기오염정보</h1><p>한국환경공단 · 공공데이터포털 실시간 측정소 데이터</p></header>
<div class="wrap">
  <div class="bar">
    <select id="sido"></select>
    <button id="reload">조회</button>
  </div>
  <div id="out" class="grid"></div>
</div>
<script src="config.js"></script>
<script>
const SIDOS=["제주","서울","부산","대구","인천","광주","대전","울산","경기","강원","충북","충남","전북","전남","경북","경남","세종"];
const sel=document.getElementById("sido"), out=document.getElementById("out");
sel.innerHTML=SIDOS.map(s=>`<option>${s}</option>`).join("");
const esc=s=>String(s??"-").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  out.className="";out.innerHTML='<div class="msg">불러오는 중...</div>';
  try{
    const r=await fetch(`${window.API_BASE}/air?sido=${encodeURIComponent(sel.value)}`);
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status);
    const d=await r.json();
    out.className="grid";
    out.innerHTML=d.map(i=>`<div class="card"><h3>${esc(i.station)}</h3><div class="time">${esc(i.time)}</div>
      <div class="row"><span>PM10 ${esc(i.pm10)}㎍/㎥</span><span class="g g-${esc(i.pm10_grade)}">${esc(i.pm10_grade)}</span></div>
      <div class="row"><span>PM2.5 ${esc(i.pm25)}㎍/㎥</span><span class="g g-${esc(i.pm25_grade)}">${esc(i.pm25_grade)}</span></div>
      <div class="row"><span>오존 ${esc(i.o3)}ppm</span></div>
      <div class="row"><span>NO₂ ${esc(i.no2)}ppm</span></div></div>`).join("")||'<div class="msg">데이터가 없습니다.</div>';
  }catch(e){out.className="";out.innerHTML=`<div class="msg err">불러오지 못했습니다: ${esc(e.message)}</div>`}
}
document.getElementById("reload").onclick=load; sel.onchange=load; load();
</script>
</body>
</html>
