<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미세먼지 현황</title>
<style>
  :root{--bg:#f2f6fb;--card:#fff;--text:#16202c;--sub:#667587;--line:#e3e9f0;
    --g1:#1a9d57;--g2:#c98a0b;--g3:#e0661f;--g4:#cf2234;--g0:#8a94a0;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#18222f;--text:#e8eef5;--sub:#93a3b6;--line:#26323f;
    --g1:#34c77b;--g2:#e5b23a;--g3:#f08a4b;--g4:#ff5b6b;--g0:#6d7a89;--accent:#6ea0ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;flex-wrap:wrap}
  h1{margin:0;font-size:22px} h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
  .ctl{display:flex;gap:8px}
  select,button{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
  .hero{background:var(--card);border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border:1px solid var(--line)}
  .big{border-radius:16px;padding:18px;border:2px solid var(--c,var(--g0))}
  .big .lb{font-size:13px;color:var(--sub)} .big .v{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0}
  .big .v small{font-size:14px;font-weight:400;color:var(--sub)} .badge{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font-size:13px;background:var(--c,var(--g0))}
  .meta{margin:14px 2px 10px;display:flex;justify-content:space-between;color:var(--sub);font-size:13px;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--g0));border-radius:14px;padding:14px}
  .card h3{margin:0;font-size:16px} .t{font-size:12px;color:var(--sub);margin:2px 0 10px}
  .r{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0}
  .r b{font-weight:600} .mini{font-size:11px;padding:1px 8px;border-radius:99px;color:#fff;margin-left:6px;background:var(--c,var(--g0))}
  .g1{--c:var(--g1)}.g2{--c:var(--g2)}.g3{--c:var(--g3)}.g4{--c:var(--g4)}.g0{--c:var(--g0)}
  .msg{padding:30px;text-align:center;color:var(--sub);grid-column:1/-1}.err{color:var(--g4)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
  .ph{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px} #fit{font-size:12px;color:var(--sub)}
  #chart svg{width:100%;height:auto;display:block} #chart .msg{padding:24px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap;margin-top:6px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .legend i.dash{background:repeating-linear-gradient(90deg,var(--sub) 0 4px,transparent 4px 7px)}
  .fcst{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .fcst div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--sub)}
  .fcst b{display:block;font-size:14px;color:var(--text)}
  footer{margin-top:28px;font-size:12px;color:var(--sub);text-align:center}
  @media (max-width:560px){.hero{grid-template-columns:1fr}.big .v{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌫️ 미세먼지 현황<small>한국환경공단 에어코리아 · 실시간 측정소 데이터</small></h1>
    <div class="ctl"><select id="sido" aria-label="시도 선택"></select><button id="reload">새로고침</button></div>
  </header>
  <section class="hero" id="hero"></section>
  <section class="panel">
    <div class="ph"><b>📈 시간별 추이 · 선형회귀 예측</b><span id="fit"></span></div>
    <div id="chart"><div class="msg">불러오는 중...</div></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>PM10 실측</span><span><i style="background:var(--g3)"></i>PM2.5 실측</span><span><i class="dash"></i>예측(점선)</span></div>
    <div id="fcst" class="fcst"></div>
  </section>
  <div class="meta"><span id="count"></span><span id="updated"></span></div>
  <div class="grid" id="grid"></div>
  <footer>데이터 출처: 공공데이터포털 한국환경공단_에어코리아_대기오염정보</footer>
</div>
<script src="config.js"></script>
<script>
const SIDOS=["제주","서울","부산","대구","인천","광주","대전","울산","경기","강원","충북","충남","전북","전남","경북","경남","세종"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"-").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TH={pm10:[30,80,150],pm25:[15,35,75]};
const NAMES=["좋음","보통","나쁨","매우나쁨"];
function grade(kind,v){const n=parseFloat(v);if(isNaN(n))return 0;const t=TH[kind];return n<=t[0]?1:n<=t[1]?2:n<=t[2]?3:4}
const gname=g=>g?NAMES[g-1]:"정보없음";
const avg=a=>{const n=a.map(parseFloat).filter(x=>!isNaN(x));return n.length?Math.round(n.reduce((x,y)=>x+y)/n.length):null};
$("sido").innerHTML=SIDOS.map(s=>`<option>${s}</option>`).join("");

function big(label,kind,v){const g=v==null?0:grade(kind,v);
  return `<div class="big g${g}"><div class="lb">${label}</div><div class="v">${v??"-"}<small> ㎍/㎥</small></div><span class="badge">${gname(g)}</span></div>`}

async function load(){
  $("grid").innerHTML='<div class="msg">불러오는 중...</div>';
  try{
    const r=await fetch(`${window.API_BASE}/air?sido=${encodeURIComponent($("sido").value)}`);
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status);
    const d=await r.json();
    $("hero").innerHTML=big(`${esc($("sido").value)} 평균 미세먼지 PM10`,"pm10",avg(d.map(i=>i.pm10)))+big(`${esc($("sido").value)} 평균 초미세먼지 PM2.5`,"pm25",avg(d.map(i=>i.pm25)));
    $("count").textContent=`측정소 ${d.length}곳`;
    $("updated").textContent=d[0]?`기준 시각 ${d[0].time}`:"";
    $("grid").innerHTML=d.map(i=>{const g=Math.max(grade("pm10",i.pm10),grade("pm25",i.pm25));
      return `<div class="card g${g}"><h3>${esc(i.station)}</h3><div class="t">${esc(i.time)}</div>
      <div class="r"><span>미세 PM10</span><span><b>${esc(i.pm10)}</b><span class="mini g${grade("pm10",i.pm10)}">${gname(grade("pm10",i.pm10))}</span></span></div>
      <div class="r"><span>초미세 PM2.5</span><span><b>${esc(i.pm25)}</b><span class="mini g${grade("pm25",i.pm25)}">${gname(grade("pm25",i.pm25))}</span></span></div>
      <div class="r"><span>오존 O₃</span><b>${esc(i.o3)}</b></div>
      <div class="r"><span>이산화질소 NO₂</span><b>${esc(i.no2)}</b></div></div>`}).join("")||'<div class="msg">데이터가 없습니다.</div>';
  }catch(e){$("hero").innerHTML="";$("grid").innerHTML=`<div class="msg err">불러오지 못했습니다: ${esc(e.message)}<br><small>백엔드: ${esc(window.API_BASE)}</small></div>`}
}
async function getJson(path){
  const r=await fetch(window.API_BASE+path);
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||r.status);
  return j;
}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function line(pts,x,y,color,dash){
  if(!pts.length) return "";
  return `<polyline fill="none" stroke="${color}" stroke-width="2.2" ${dash?'stroke-dasharray="6 5"':""} points="${pts.map(p=>x(p.t)+","+y(p.v)).join(" ")}"/>`+
    pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${dash?2.5:2}" fill="${dash?"none":color}" stroke="${color}"/>`).join("");
}
async function loadTrend(){
  const s=encodeURIComponent($("sido").value);
  $("fcst").innerHTML="";$("fit").textContent="";
  try{
    const [h,p]=await Promise.all([getJson(`/air/history?sido=${s}&hours=72`),getJson(`/air/predict?sido=${s}&hours=72&ahead=6`)]);
    const T=x=>new Date(x.replace(" ","T")).getTime();
    const hist=k=>h.filter(r=>r[k]!=null).map(r=>({t:T(r.time),v:r[k]}));
    const fc=k=>p.predictions[k]?p.predictions[k].forecast.map(f=>({t:T(f.time),v:f.value})):[];
    const a10=hist("pm10"),a25=hist("pm25"),f10=fc("pm10"),f25=fc("pm25");
    if(a10.length+a25.length<2){
      $("chart").innerHTML=`<div class="msg">저장된 데이터 ${h.length}건 — 서버가 30분마다 자동으로 쌓고 있습니다. 2개 시각 이상 쌓이면 그래프가 나타나고, 3개 이상이면 예측이 계산됩니다.</div>`;return;
    }
    const all=[...a10,...a25,...f10,...f25];
    const W=720,H=260,L=40,R=12,Tp=12,B=28;
    const t0=Math.min(...all.map(d=>d.t)),t1=Math.max(...all.map(d=>d.t));
    const vmax=Math.max(10,Math.ceil(Math.max(...all.map(d=>d.v))/10)*10);
    const x=t=>L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R), y=v=>Tp+(1-v/vmax)*(H-Tp-B);
    const grid=[0,.25,.5,.75,1].map(f=>{const v=Math.round(vmax*f),yy=y(v);return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${cssv("--line")}"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="${cssv("--sub")}">${v}</text>`}).join("");
    const ticks=[0,.5,1].map(f=>{const t=t0+(t1-t0)*f,d=new Date(t);return `<text x="${x(t)}" y="${H-8}" text-anchor="${f===0?"start":f===1?"end":"middle"}" font-size="11" fill="${cssv("--sub")}">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}시</text>`}).join("");
    const nowX=a10.length||a25.length?x(Math.max(...[...a10,...a25].map(d=>d.t))):null;
    $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="미세먼지 시간별 추이와 예측">${grid}${ticks}
      ${nowX&&f10.length+f25.length?`<line x1="${nowX}" x2="${nowX}" y1="${Tp}" y2="${H-B}" stroke="${cssv("--sub")}" stroke-dasharray="2 4"/>`:""}
      ${line(a10,x,y,cssv("--accent"))}${line(a25,x,y,cssv("--g3"))}${line(f10,x,y,cssv("--accent"),true)}${line(f25,x,y,cssv("--g3"),true)}</svg>`;
    const m=p.predictions;
    $("fit").textContent=m.pm10?`PM10 변화율 ${m.pm10.slope_per_hour>0?"+":""}${m.pm10.slope_per_hour}㎍/㎥ per 시간 · R² ${m.pm10.r2} · 표본 ${p.points}시각`:`표본 ${p.points}시각`;
    $("fcst").innerHTML=(m.pm10?m.pm10.forecast:[]).map((f,i)=>`<div>${f.time.slice(5,16)}<b>PM10 ${f.value}</b>${m.pm25?`PM2.5 ${m.pm25.forecast[i].value}`:""}</div>`).join("");
  }catch(e){$("chart").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
$("reload").onclick=()=>{load();loadTrend()};$("sido").onchange=()=>{load();loadTrend()};load();loadTrend();
</script>
</body>
</html>
