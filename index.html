<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 마켓</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">🍊 <span>제주 마켓</span></div>
    <button class="cart-btn" id="openCart" aria-label="장바구니 열기">
      🛒 <span class="cart-label">장바구니</span>
      <span class="badge" id="badge">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1>제주의 맛을 집에서</h1>
  <p>산지 직송 감귤부터 흑돼지까지, 담기만 하세요.</p>
</section>

<main class="wrap">
  <div id="status" class="status" hidden></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>🛒 내 장바구니</h2>
    <button class="x" id="closeCart" aria-label="닫기">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="sum"><span>합계</span><b id="total">0원</b></div>
    <button class="order" id="orderBtn">주문하기</button>
    <button class="clear" id="clearBtn">비우기</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
